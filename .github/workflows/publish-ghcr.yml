name: Publish GHCR images
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/ryvolodya/simple-netflow-${{ matrix.component }}:latest
            ghcr.io/ryvolodya/simple-netflow-${{ matrix.component }}:${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
