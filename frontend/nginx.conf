server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  etag off;

  # Real-time Server-Sent Events stream. Buffering must stay disabled.
  location = /api/events {
    proxy_pass http://backend:8000/api/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
  }

  # The application is a single-page frontend with inline JavaScript.
  # Never cache it, otherwise an old frontend can keep calling removed API routes.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri /index.html;
  }
}
